<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">DERET FSM Concept</title>
  <desc id="desc">Conceptual demand-event reactive traffic controller state flow.</desc>
  <rect width="960" height="540" rx="28" fill="#0a192f"/>
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#2489f6"/>
      <stop offset="1" stop-color="#f7d46b"/>
    </linearGradient>
  </defs>
  <g fill="#172a46" stroke="#60a5fa" stroke-width="4">
    <rect x="70" y="210" width="170" height="90" rx="18"/>
    <rect x="300" y="90" width="170" height="90" rx="18"/>
    <rect x="300" y="340" width="170" height="90" rx="18"/>
    <rect x="545" y="210" width="170" height="90" rx="18"/>
    <rect x="760" y="210" width="130" height="90" rx="18"/>
  </g>
  <g font-family="Arial, sans-serif" font-weight="700" text-anchor="middle" fill="#f8fbff">
    <text x="155" y="250" font-size="22">IDLE</text>
    <text x="155" y="276" font-size="14" fill="#93c5fd">scan demand</text>
    <text x="385" y="130" font-size="22">NS GREEN</text>
    <text x="385" y="156" font-size="14" fill="#93c5fd">north/south flow</text>
    <text x="385" y="380" font-size="22">EW GREEN</text>
    <text x="385" y="406" font-size="14" fill="#93c5fd">east/west flow</text>
    <text x="630" y="250" font-size="22">YELLOW</text>
    <text x="630" y="276" font-size="14" fill="#93c5fd">safe transition</text>
    <text x="825" y="250" font-size="22">ALL RED</text>
    <text x="825" y="276" font-size="14" fill="#93c5fd">clearance</text>
  </g>
  <g fill="none" stroke="url(#line)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 245 C260 210 276 170 300 145"/>
    <path d="M240 272 C265 314 278 356 300 385"/>
    <path d="M470 135 C530 142 562 174 602 210"/>
    <path d="M470 385 C530 378 562 336 602 300"/>
    <path d="M715 255 H760"/>
    <path d="M825 300 C810 455 125 455 155 300"/>
  </g>
  <g fill="#f7d46b">
    <circle cx="300" cy="145" r="7"/>
    <circle cx="300" cy="385" r="7"/>
    <circle cx="602" cy="210" r="7"/>
    <circle cx="602" cy="300" r="7"/>
    <circle cx="760" cy="255" r="7"/>
  </g>
